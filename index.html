<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday OB</title>
<!-- Both style blocks stay OFF until needed, so the first page is plain white with no CSS -->
<style id="layout" media="not all">
html,body{margin:0}
#wrap{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;min-height:100vh;box-sizing:border-box;padding:10px;font-family:system-ui,sans-serif}
#title{height:52px;display:flex;align-items:center;white-space:pre;font:800 clamp(22px,4.2vh,42px)/1.1 system-ui,sans-serif}
#main{display:flex;gap:24px;align-items:stretch;justify-content:center}
#stage{position:relative;flex:none;border-radius:14px;perspective:1000px}
#term{flex:none;display:flex;flex-direction:column;background:#000;border:1px solid #1f6;border-radius:10px;overflow:hidden;opacity:0;box-shadow:0 0 22px rgba(0,255,80,.45)}
#bar{background:#111;color:#1f6;font:12px monospace;padding:6px 10px;border-bottom:1px solid #1f6;flex:none}
#txt{flex:1;min-height:0;overflow-y:auto;color:#1f6;font-family:"Courier New",monospace;line-height:1.5;padding:12px;white-space:pre-wrap;text-shadow:0 0 6px #1f6}
#cur{animation:blink 1s steps(1) infinite}
#prog{width:min(60vw,500px);height:4px;border-radius:4px;background:rgba(255,255,255,.18);overflow:hidden}
#progbar{height:100%;width:0;background:linear-gradient(90deg,#7af,#f7a,#fd7);transition:width 15s linear}
@keyframes blink{50%{opacity:0}}
@keyframes glow{0%,100%{box-shadow:0 0 25px rgba(120,170,255,.35)}50%{box-shadow:0 0 60px rgba(255,120,200,.55)}}
</style>
<style id="party" media="not all">
@keyframes bg{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes rise{from{transform:translateY(0)}to{transform:translateY(-140vh)}}
@keyframes sway{0%,100%{margin-left:-16px}50%{margin-left:16px}}
@keyframes pop{0%{transform:scale(.94)}55%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes shine{from{left:-60%}to{left:150%}}
@keyframes up{from{opacity:0;transform:translateY(40px) scale(.96)}to{opacity:1;transform:none}}
@keyframes drop{from{opacity:0;transform:translateY(-70px) scale(.4) rotate(-20deg)}to{opacity:1;transform:none}}
@keyframes ring{from{transform:translate(-50%,-50%) scale(0);opacity:.9}to{transform:translate(-50%,-50%) scale(1);opacity:0}}
body{background:linear-gradient(120deg,#ff9a9e,#fad0c4,#fbc2eb,#a6c1ee,#84fab0,#ffe29f);background-size:400% 400%;animation:bg 12s ease infinite}
#stage{animation:pop .9s ease-out;box-shadow:0 10px 40px rgba(0,0,0,.35)}
#stage::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;border-radius:14px;background:linear-gradient(100deg,transparent,rgba(255,255,255,.65),transparent);transform:skewX(-20deg);animation:shine 1.5s ease-out .25s 1 both;pointer-events:none}
#term{animation:up .9s cubic-bezier(.16,1,.3,1) 1s both}
#title span{display:inline-block;animation:drop .8s cubic-bezier(.2,1.5,.4,1) both;text-shadow:0 2px 14px rgba(255,255,255,.8)}
.balloon{position:fixed;bottom:-140px;border-radius:50% 50% 50% 50%/45% 45% 55% 55%;z-index:0;pointer-events:none;box-shadow:inset -7px -9px 16px rgba(0,0,0,.2);animation:rise 10s linear infinite,sway 3s ease-in-out infinite}
.balloon::before{content:"";position:absolute;top:14%;left:20%;width:22%;height:26%;border-radius:50%;background:rgba(255,255,255,.6);transform:rotate(30deg)}
.balloon::after{content:"";position:absolute;left:50%;top:100%;width:1px;height:55px;background:rgba(0,0,0,.35)}
.ring{position:fixed;width:1400px;height:1400px;border-radius:50%;border:5px solid #fff;z-index:3;pointer-events:none;animation:ring 1.8s ease-out forwards}
</style>
</head>
<body>

<div id="home" style="position:fixed;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center">
  <button id="b">press here ob</button>
  <div id="pop"></div>
</div>

<div id="veil" style="position:fixed;inset:0;z-index:1;opacity:0;transition:opacity 1.5s ease;background:radial-gradient(circle at 50% 40%,#1c2c52,#04060e);pointer-events:none"></div>
<canvas id="fx" style="position:fixed;top:0;left:0;pointer-events:none;z-index:5"></canvas>

<div id="wrap" style="display:none">
  <div id="title"></div>
  <div id="main">
    <div id="stage"></div>
    <div id="term"><div id="bar">ob@birthday:~$ cat message.txt</div><div id="txt"><span id="out"></span><span id="cur">█</span></div></div>
  </div>
  <div id="prog"><div id="progbar"></div></div>
</div>

<script>
// === Keep these 3 files in the SAME folder: ob-birthday.html, ob.jpg, obsong.mp3 ===
var PHOTO = "ob.jpg";
var SONG  = "obsong.mp3";

var MSG = "Hi da ob, the one who used to watch cartoons and pick fights for pokemon cards and in the competetion of who knows more characters in shinchan grew up to 20 by officially ended your teenage and be proud that i spoiled you by showing tpd and azn iykyk haha but you are always a kutti kunjan to me\n\nik there has been a big misunderstanding going among us, but deep down this isn’t a big thing so stop thinking that i left you behind don't do it, seeing you win is also a part of my dream\n\nso now you are 20 yo kiddo no im sorry adult\n\nIn this decade many things are gonna happen\nwork marriage kids what not\nenjoy your life\nim always a call away\n\nhappy birthday da chigga love u ummaaahhhhh!!!!";

var steps = ["happy birthday da ob — press again", "happy 20 da ob — press again", "turn the volume up"];
var n = 0, aud = null, CW = 0;
var $ = function (id) { return document.getElementById(id); };
var b = $("b"), pop = $("pop");

b.onclick = function () {
  pop.style.cssText = "border:1px solid #000;padding:8px;margin-top:10px;display:inline-block";
  pop.textContent = steps[n];
  n++;
  if (n === 3) {
    b.style.display = "none";
    aud = new Audio(SONG); aud.loop = true; aud.preload = "auto"; // loaded now, played when assembly starts
    setTimeout(function () { pop.style.display = "none"; startPhoto(); }, 2500);
  }
};

function loadPhoto(cb) {
  var im = new Image();
  im.onload = function () { cb(im.src, im.naturalWidth, im.naturalHeight); };
  im.onerror = function () {
    var c = document.createElement("canvas"); c.width = 960; c.height = 540;
    var x = c.getContext("2d"), g = x.createLinearGradient(0, 0, 960, 540);
    g.addColorStop(0, "#ff6a88"); g.addColorStop(1, "#4facfe");
    x.fillStyle = g; x.fillRect(0, 0, 960, 540);
    x.fillStyle = "#fff"; x.font = "bold 64px sans-serif"; x.textAlign = "center";
    x.fillText("ob.jpg not found", 480, 290);
    cb(c.toDataURL(), 960, 540);
  };
  im.src = PHOTO;
}

function startPhoto() {
  loadPhoto(function (src, iw, ih) {
    $("layout").media = "all";
    $("home").style.display = "none";
    $("veil").style.opacity = 1;
    $("wrap").style.display = "flex";
    if (aud) aud.play().catch(function () {});           // music starts exactly when assembly starts

    // ---- size everything to fit one laptop screen (no scrolling) ----
    var vw = innerWidth, vh = innerHeight, wide = vw >= 900 && vw > vh;
    var W, H, TW, TH;
    if (wide) {
      var availH = vh - 120;
      W = Math.min(vw * 0.6, availH * iw / ih, 900); H = W * ih / iw;
      TW = Math.min(vw - W - 90, 520); TH = H;
      document.body.style.overflow = "hidden";
      $("wrap").style.height = "100vh";
    } else {
      W = Math.min(vw * 0.94, 800); H = W * ih / iw;
      TW = Math.min(vw * 0.94, 640); TH = 260;
      $("main").style.flexDirection = "column"; $("main").style.alignItems = "center";
      document.body.style.overflowX = "hidden";
    }
    CW = wide ? W + 24 + TW : W;
    var stage = $("stage");
    stage.style.width = W + "px"; stage.style.height = H + "px";
    stage.style.animation = "glow 3s ease-in-out infinite";
    $("term").style.width = TW + "px"; $("term").style.height = TH + "px";
    $("txt").style.fontSize = Math.max(11, Math.min(15, TW / 40)) + "px";

    // ---- tiles: 3D fly-in, blur + brightness settle, wave from the centre outward ----
    var cols = 12, rows = Math.max(5, Math.round(12 * ih / iw));
    var tw = W / cols, th = H / rows, tiles = [], R = Math.random;
    for (var r = 0; r < rows; r++) for (var c = 0; c < cols; c++) {
      var t = document.createElement("div");
      t.style.cssText = "position:absolute;left:" + c * tw + "px;top:" + r * th + "px;width:" + (tw + 0.6) + "px;height:" + (th + 0.6) + "px;background-image:url('" + src + "');background-size:" + W + "px " + H + "px;background-position:-" + c * tw + "px -" + r * th + "px;opacity:0;will-change:transform,opacity,filter;filter:blur(12px) brightness(2.4);" +
        "transform:translate3d(" + ((R() - 0.5) * 1.8 * vw) + "px," + ((R() - 0.5) * 1.8 * vh) + "px," + (-900 + R() * 1200) + "px) rotateX(" + (R() * 360 - 180) + "deg) rotateY(" + (R() * 360 - 180) + "deg) rotate(" + (R() * 180 - 90) + "deg) scale(.25)";
      stage.appendChild(t); tiles.push(t);
    }
    stage.offsetHeight;
    tiles.forEach(function (t, k) {
      var r = Math.floor(k / cols), c = k % cols;
      var dx = (c + 0.5) / cols - 0.5, dy = (r + 0.5) / rows - 0.5;
      var dist = Math.min(1, Math.sqrt(dx * dx + dy * dy) / 0.71);
      var d = dist * 11 + R() * 1.5;                       // max 12.5s + 2.5s flight = 15s
      t.style.transition = "transform 2.5s cubic-bezier(.16,1,.3,1) " + d + "s, opacity .8s ease " + d + "s, filter 2s ease " + d + "s";
      t.style.opacity = 1; t.style.filter = "none"; t.style.transform = "none";
    });
    $("progbar").style.width = "100%";                      // 15s progress line
    setTimeout(party, 15200);
  });
}

// ---------- confetti cannons (canvas physics) ----------
var fx = $("fx"), ctx = fx.getContext("2d"), parts = [], running = false;
function fit() { fx.width = innerWidth; fx.height = innerHeight; }
fit(); addEventListener("resize", fit);
function cannon(x, dir) {
  for (var i = 0; i < 80; i++) {
    var a = -Math.PI / 2 + dir * (0.15 + Math.random() * 0.75), s = 14 + Math.random() * 16;
    parts.push({ x: x, y: innerHeight + 10, vx: Math.cos(a) * s, vy: Math.sin(a) * s, w: 6 + Math.random() * 7, h: 4 + Math.random() * 6,
      rot: Math.random() * 6, vr: (Math.random() - 0.5) * 0.4, c: "hsl(" + Math.floor(Math.random() * 360) + ",90%,58%)" });
  }
  if (!running) { running = true; loop(); }
}
function loop() {
  ctx.clearRect(0, 0, fx.width, fx.height);
  parts = parts.filter(function (p) {
    p.vy += 0.38; p.vx *= 0.985; p.vy *= 0.985; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.scale(1, Math.cos(p.rot * 2));
    ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore();
    return p.y < innerHeight + 30;
  });
  if (parts.length) requestAnimationFrame(loop); else running = false;
}

function party() {
  $("party").media = "all";
  var veil = $("veil"); veil.style.transition = "opacity 1.2s ease"; veil.style.opacity = 0;
  $("prog").style.display = "none";
  $("stage").style.animation = "";                         // hand over to the party pop + shine

  // flash + shockwave rings from the photo centre
  var fl = document.createElement("div");
  fl.style.cssText = "position:fixed;inset:0;background:#fff;z-index:6;opacity:1;transition:opacity 1s ease-out;pointer-events:none";
  document.body.appendChild(fl); setTimeout(function () { fl.style.opacity = 0; }, 60); setTimeout(function () { fl.remove(); }, 1200);
  var rc = $("stage").getBoundingClientRect();
  [0, 250, 500].forEach(function (dl) {
    var rg = document.createElement("div"); rg.className = "ring";
    rg.style.left = rc.left + rc.width / 2 + "px"; rg.style.top = rc.top + rc.height / 2 + "px"; rg.style.animationDelay = dl + "ms";
    rg.addEventListener("animationend", function (e) { e.target.remove(); });
    document.body.appendChild(rg);
  });

  // title letters drop in one by one
  var txt = "Happy 20th Birthday OB!", ti = $("title");
  for (var i = 0; i < txt.length; i++) {
    var s = document.createElement("span"); s.textContent = txt[i] === " " ? "\u00a0" : txt[i];
    s.style.color = "hsl(" + (i * 17) + ",85%,42%)"; s.style.animationDelay = (0.3 + i * 0.05) + "s"; ti.appendChild(s);
  }

  // confetti cannons from both bottom corners, 4 volleys
  [0, 600, 1300, 2300].forEach(function (dl) { setTimeout(function () { cannon(0, 1); cannon(innerWidth, -1); }, dl); });

  // balloons
  var vw = innerWidth;
  for (var k = 0; k < 20; k++) {
    var el = document.createElement("div"); el.className = "balloon";
    el.style.background = "hsl(" + Math.floor(Math.random() * 360) + ",85%,60%)";
    place(el); document.body.appendChild(el);
    el.addEventListener("animationiteration", function (e) { if (e.animationName === "rise") place(e.target); });
  }
  function place(el) {
    var side = (vw - CW) / 2 - 70, x;
    if (vw > 800 && side > 60) x = Math.random() < 0.5 ? Math.random() * side : vw - 60 - Math.random() * side;  // keep to the sides
    else x = Math.random() * (vw - 60);                                                                        // else float behind the photo
    var sc = 0.7 + Math.random() * 0.7;
    el.style.left = x + "px"; el.style.width = 54 * sc + "px"; el.style.height = 68 * sc + "px";
    el.style.opacity = 0.75 + sc * 0.2;
    el.style.animationDuration = (14 - sc * 5 + Math.random() * 3) + "s, " + (2 + Math.random() * 3) + "s";
    el.style.animationDelay = (Math.random() * -6) + "s, 0s";
  }
  setTimeout(typeMsg, 2000);
}

function typeMsg() {
  var out = $("out"), box = $("txt"), i = 0;
  (function tick() {
    if (i >= MSG.length) return;
    out.textContent += MSG.charAt(i++);
    box.scrollTop = box.scrollHeight;
    setTimeout(tick, 22);
  })();
}
</script>
</body>
</html>
